# docker compose --env-file .env.local up -d --build
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    restart: always
    env_file:
      - .env.local
    environment:
      FAMILY_DATA_FILE: /app/data/Family_Genealogy.xlsx
    volumes:
      - family-data:/app/data

volumes:
  family-data:
